name: native

# 目标：在 glibc 2.28 的构建环境里编出 ownvst3 的 Linux .so，
# 并"证明"它真的能在 glibc 2.28 上 dlopen、且导出 TuneLab 需要的那 20 个符号
# （这是当前 Linux 端到端最大的未知数）。
#
# 源码用 ModernMube/OwnVST3（公开的 C++ 源码，CMake 工程版本 1.5.4）。
# NuGet 上 OwnAudioVst 1.7.0 的 native 来自更新的、未公开的源码；但 1.5.4 的
# 导出是 1.7.0 那 20 个的超集，所以按名字核对即可确认可替换。
#
# 为什么是 AlmaLinux 8：它的 glibc 正好是 2.28，与验证机 Anolis 8.10 一致。
# 在更新的发行版上编出来的 .so 会引用更新的 GLIBC_2.38 符号，拿到 2.28 上直接
# "version GLIBC_2.38 not found"。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-glibc228:
    name: linux-x64 / glibc 2.28
    runs-on: ubuntu-latest
    timeout-minutes: 60

    container:
      image: almalinux:8

    steps:
      # 不用 actions/checkout：容器里是 AlmaLinux，node20 的兼容性不在本任务的验证范围内。
      - name: 取源码（含 VST3 SDK 子模块）
        run: |
          dnf install -y git cmake gcc-c++ make which tar gzip
          git clone --depth 1 https://github.com/ModernMube/OwnVST3.git /src
          cd /src
          git submodule update --init --recursive --depth 1

      - name: 编译
        run: |
          cd /src
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"

      - name: 检查产物
        run: |
          ls -l /src/build
          echo "--- 导出的符号（前 20 个）---"
          nm -D --defined-only /src/build/libownvst3.so | head -n 20 || true

      - name: 检查 GLIBC 符号版本上限
        run: |
          set -eu
          lib=/src/build/libownvst3.so
          echo "--- 依赖的 GLIBC 版本 ---"
          objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sort -u -V || true
          echo "--- 依赖的 GLIBCXX 版本 ---"
          objdump -T "$lib" | grep -o 'GLIBCXX_[0-9.]*' | sort -u -V || true

          max=$(objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n 1)
          echo "max GLIBC symbol version = $max"

          if [ "$(printf '%s\n' 2.28 "$max" | sort -V | tail -n 1)" != "2.28" ]; then
            echo "::error::libownvst3.so requires GLIBC_$max, newer than 2.28"
            exit 1
          fi

      - name: 冒烟测试（dlopen + 取符号）
        run: |
          set -eu
          cat > /src/smoke.c <<'EOF'
          #include <dlfcn.h>
          #include <stdio.h>
          int main(void)
          {
              void *handle = dlopen("/src/build/libownvst3.so", RTLD_NOW | RTLD_LOCAL);
              if (handle == NULL)
              {
                  printf("dlopen failed: %s\n", dlerror());
                  return 1;
              }
              printf("dlopen ok: %p\n", handle);
              return 0;
          }
          EOF
          gcc /src/smoke.c -ldl -o /src/smoke
          /src/smoke
          echo "glibc: $(ldd --version | head -n 1)"

      - name: 校验 TuneLab 需要的那 20 个导出
        run: |
          set -eu
          lib=/src/build/libownvst3.so
          nm -D --defined-only "$lib" | awk '{print $NF}' | sort > /tmp/exports.txt

          # 这份清单来自 TuneLab 的 Vendored/OwnVST3*.cs（_export("...")）。
          # 上游公开源码是 1.5.4，导出 33 个；NuGet 上的 1.7.0 native 用了其中 20 个。
          # 名字对得上 = managed 侧的 P/Invoke 不会 EntryPointNotFound。
          missing=0
          for name in \
            VST3Plugin_ClearStringCache VST3Plugin_CloseEditor VST3Plugin_Create \
            VST3Plugin_CreateEditor VST3Plugin_Destroy VST3Plugin_GetEditorSize \
            VST3Plugin_GetName VST3Plugin_GetParameter VST3Plugin_GetParameterAt \
            VST3Plugin_GetParameterCount VST3Plugin_GetPluginInfo VST3Plugin_GetVendor \
            VST3Plugin_Initialize VST3Plugin_IsEffect VST3Plugin_IsInstrument \
            VST3Plugin_LoadPlugin VST3Plugin_ProcessAudio VST3Plugin_ProcessMidi \
            VST3Plugin_ResizeEditor VST3Plugin_SetParameter
          do
            if ! grep -qx "$name" /tmp/exports.txt; then
              echo "::error::missing export: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "all 20 exports present"

      - name: 上传 .so
        uses: actions/upload-artifact@v4
        with:
          name: libownvst3-linux-x64-glibc228
          path: /src/build/libownvst3.so
          if-no-files-found: error
